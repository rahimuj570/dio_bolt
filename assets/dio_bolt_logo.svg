<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131722" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>

    <!-- Request Channel & Node (Dio Cyan/Blue) -->
    <linearGradient id="reqGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Response Channel & Node (Warm Amber/Orange) -->
    <linearGradient id="resGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Bolt Body Primary Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Clean Geometric Facet Highlight -->
    <linearGradient id="facetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Container Squircle (Developer Tool Slate) -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#bgGrad)" stroke="#222a3d" stroke-width="3" />

  <!-- Inbound Request Channel (HTTP Origin Node -> Pipeline) -->
  <g id="request-pipeline">
    <line x1="120" y1="184" x2="228" y2="184" stroke="url(#reqGrad)" stroke-width="24" stroke-linecap="round" />
    <!-- Request Origin Node -->
    <circle cx="120" cy="184" r="28" fill="#131722" stroke="url(#reqGrad)" stroke-width="14" />
    <circle cx="120" cy="184" r="9" fill="#38bdf8" />
  </g>

  <!-- Outbound Response Channel (Pipeline -> HTTP Response Terminal) -->
  <g id="response-pipeline">
    <line x1="284" y1="328" x2="392" y2="328" stroke="url(#resGrad)" stroke-width="24" stroke-linecap="round" />
    <!-- Response Terminal Node -->
    <circle cx="392" cy="328" r="28" fill="#0b0e14" stroke="url(#resGrad)" stroke-width="14" />
    <circle cx="392" cy="328" r="9" fill="#f59e0b" />
  </g>

  <!-- Central Fast-Transport Lightning Bolt (Custom Geometric Silhouette) -->
  <g id="bolt-core">
    <!-- Main Unified Bolt Silhouette -->
    <polygon points="340,124 220,184 172,268 276,268 172,388 292,328 340,244 236,244"
             fill="url(#boltGrad)"
             stroke="#0b0e14"
             stroke-width="8"
             stroke-linejoin="round" />

    <!-- Sharp Directional Facet (Adds Depth & Custom Open-Source Brand Character) -->
    <polygon points="340,124 220,184 172,268 276,268 256,256 340,244"
             fill="url(#facetGrad)" />
  </g>
</svg>
